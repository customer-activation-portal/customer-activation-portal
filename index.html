
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Customer Activation Portal</title>

  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #1e293b;
    }

    .login-card {
      width: 100%;
      max-width: 430px;
      padding: 38px 30px;
      text-align: center;
      background: white;
      border-radius: 16px;
      box-shadow: 0 8px 35px rgba(15, 23, 42, .08);
    }

    .logo {
      width: 58px;
      height: 58px;
      margin: 0 auto 20px;
      display: grid;
      place-items: center;
      border-radius: 14px;
      background: #12345a;
      color: white;
      font-size: 25px;
      font-weight: bold;
    }

    h1 {
      margin: 0;
      color: #12345a;
      font-size: 23px;
    }

    .description {
      margin: 13px 0 28px;
      color: #64748b;
      font-size: 14px;
      line-height: 1.7;
    }

    #googleButton {
      display: flex;
      justify-content: center;
      min-height: 44px;
    }

    #status {
      margin-top: 22px;
      font-size: 13px;
      line-height: 1.6;
      color: #64748b;
      overflow-wrap: anywhere;
    }

    .footer {
      margin-top: 32px;
      color: #94a3b8;
      font-size: 11px;
    }
  </style>
</head>

<body>
  <main class="login-card">
    <div class="logo">CA</div>

    <h1>Customer Activation Portal</h1>

    <p class="description">
      Silakan masuk menggunakan akun Google
      yang terdaftar pada portal.
    </p>

    <div id="googleButton"></div>

    <div id="status">
      Menyiapkan layanan Google Login...
    </div>

    <div class="footer">
      Internal Application · Customer Activation Portal
    </div>
  </main>

  <script>
    const GOOGLE_CLIENT_ID =
      '56350678879-egqgpret0id4k671hgqsb15rnc7e147a.apps.googleusercontent.com';

    const WORKER_URL =
      'https://ca-portal-auth.wahyu-ari-kerja.workers.dev/verify';

    const statusBox = document.getElementById('status');

    async function handleGoogleResponse(response) {
      statusBox.textContent =
        'Memverifikasi identitas Google...';

      try {
        const result = await fetch(WORKER_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            idToken: response.credential
          })
        });

        const data = await result.json();

        if (!result.ok || !data.success) {
          throw new Error(
            data.errorCode || 'VERIFICATION_FAILED'
          );
        }

        statusBox.textContent =
          'IDENTITAS GOOGLE TERVERIFIKASI\n' +
          'Email: ' + data.identity.email + '\n\n' +
          'Verifikasi berhasil. Hak akses portal ' +
          'belum diberikan.';

      } catch (error) {
        statusBox.textContent =
          'Verifikasi gagal. Silakan coba kembali. (' +
          error.message + ')';
      }
    }

    function initializeGoogleLogin() {
      if (!window.google || !google.accounts) {
        statusBox.textContent =
          'Layanan Google belum berhasil dimuat. ' +
          'Silakan muat ulang halaman.';
        return;
      }

      google.accounts.id.initialize({
        client_id: GOOGLE_CLIENT_ID,
        callback: handleGoogleResponse
      });

      google.accounts.id.renderButton(
        document.getElementById('googleButton'),
        {
          theme: 'outline',
          size: 'large',
          shape: 'rectangular',
          text: 'signin_with',
          width: 280
        }
      );

      statusBox.textContent =
        'Silakan pilih akun Google untuk melanjutkan.';
    }

    window.addEventListener('load', initializeGoogleLogin);
  </script>
</body>
</html>
